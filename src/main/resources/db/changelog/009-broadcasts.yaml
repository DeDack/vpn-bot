databaseChangeLog:
  - changeSet:
      id: 009-broadcasts
      author: abcvpn
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE users ADD COLUMN marketing_opt_out BOOLEAN NOT NULL DEFAULT FALSE;
              ALTER TABLE users ADD COLUMN telegram_blocked BOOLEAN NOT NULL DEFAULT FALSE;

              CREATE TABLE broadcasts (
                  id BIGSERIAL PRIMARY KEY,
                  template_type VARCHAR(32) NOT NULL,
                  message_text TEXT NOT NULL,
                  button_text VARCHAR(64),
                  button_type VARCHAR(16),
                  button_value VARCHAR(500),
                  marketing BOOLEAN NOT NULL DEFAULT TRUE,
                  status VARCHAR(16) NOT NULL DEFAULT 'DRAFT',
                  recipient_count INTEGER NOT NULL DEFAULT 0,
                  sent_count INTEGER NOT NULL DEFAULT 0,
                  failed_count INTEGER NOT NULL DEFAULT 0,
                  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  confirmed_at TIMESTAMPTZ,
                  completed_at TIMESTAMPTZ,
                  CHECK (status IN ('DRAFT','QUEUED','SENDING','COMPLETED','CANCELLED')),
                  CHECK (button_type IS NULL OR button_type IN ('URL','CALLBACK'))
              );

              CREATE TABLE broadcast_segments (
                  broadcast_id BIGINT NOT NULL REFERENCES broadcasts(id) ON DELETE CASCADE,
                  segment VARCHAR(48) NOT NULL,
                  PRIMARY KEY (broadcast_id,segment)
              );

              CREATE TABLE broadcast_deliveries (
                  id BIGSERIAL PRIMARY KEY,
                  broadcast_id BIGINT NOT NULL REFERENCES broadcasts(id) ON DELETE CASCADE,
                  telegram_id BIGINT NOT NULL REFERENCES users(telegram_id) ON DELETE CASCADE,
                  status VARCHAR(16) NOT NULL DEFAULT 'PENDING',
                  attempts INTEGER NOT NULL DEFAULT 0,
                  next_attempt_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  telegram_message_id INTEGER,
                  error VARCHAR(500),
                  sent_at TIMESTAMPTZ,
                  updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  UNIQUE (broadcast_id,telegram_id),
                  CHECK (status IN ('PENDING','SENDING','RETRY','SENT','FAILED','SKIPPED'))
              );
              CREATE INDEX broadcast_deliveries_queue_idx ON broadcast_deliveries(status,next_attempt_at);

              CREATE TABLE return_bonuses (
                  telegram_id BIGINT PRIMARY KEY REFERENCES users(telegram_id) ON DELETE CASCADE,
                  days INTEGER NOT NULL CHECK (days = 2),
                  activated_at TIMESTAMPTZ NOT NULL,
                  previous_expires_at TIMESTAMPTZ
              );
